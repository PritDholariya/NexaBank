server:
  port: 8080 # The frontend will ONLY ever talk to Port 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - http://localhost:3000
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
      routes:
        - id: account-service-route
          uri: lb://ACCOUNT-SERVICE # lb stands for Load Balancer. It asks the Phonebook (Eureka) for the IP address!
          predicates:
            - Path=/api/accounts/** # Any URL starting with this gets sent to the Account Service
        
        - id: auth-service-route
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
