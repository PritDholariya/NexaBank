server:
  port: 8082

spring:
  application:
    name: auth-service
  config:
    import: optional:file:../../.env[.properties]

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    org.springframework.cloud.openfeign: DEBUG
    com.nexabank.authservice: DEBUG

jwt:
  secret: ${JWT_SECRET}
